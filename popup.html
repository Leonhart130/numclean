<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NumClean</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb;
    --soft: #f3f4f6; --accent: #2563eb; --off: #cbd5e1; --ok: #047857;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b; --fg: #f4f4f5; --muted: #a1a1aa; --line: #2e2e33;
      --soft: #232328; --accent: #3b82f6; --off: #3f3f46; --ok: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 340px; background: var(--bg); color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; margin: 0; }
  header small { display: block; color: var(--muted); font-size: 11.5px; }
  section { padding: 8px 16px 10px; border-bottom: 1px solid var(--line); }
  section:last-child { border-bottom: 0; }
  h2 {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 4px 0 2px;
  }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 6px 0; cursor: pointer;
  }
  .row small { display: block; color: var(--muted); font-size: 11.5px; }
  .row b { font-weight: 600; }
  .row.na { cursor: default; opacity: .6; }

  /* interrupteurs */
  .sw { position: relative; flex: none; width: 34px; height: 20px; display: inline-block; }
  .sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--off); transition: background .15s; pointer-events: none; }
  .sw i::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
  }
  .sw input:checked + i { background: var(--accent); }
  .sw input:checked + i::after { transform: translateX(14px); }
  .sw input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw input:disabled { cursor: default; }

  body.off .opts { opacity: .45; pointer-events: none; }

  textarea {
    width: 100%; min-height: 44px; resize: vertical; margin-top: 6px; padding: 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--soft); color: var(--fg);
    font: 13px ui-monospace, Menlo, Consolas, monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .result { margin-top: 6px; min-height: 18px; white-space: pre-wrap; word-break: break-all; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  .result.ok { color: var(--ok); }
  .result.none { color: var(--muted); font-family: inherit; }
  .result .kind { color: var(--muted); font-family: system-ui, sans-serif; font-size: 11.5px; margin-left: 6px; }
  .copy {
    margin-top: 8px; padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: #fff; font: 600 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .copy:hover { filter: brightness(1.08); }
  .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <div>
      <h1>NumClean</h1>
      <small>Nettoyage des numéros au copier-coller</small>
    </div>
    <label class="sw" title="Activer / désactiver l'extension">
      <input type="checkbox" id="enabled"><i></i>
    </label>
  </header>

  <div class="opts">
    <section>
      <h2>Quand</h2>
      <label class="row">
        <span>Au copier<small>Ctrl+C et Ctrl+X</small></span>
        <span class="sw"><input type="checkbox" id="onCopy"><i></i></span>
      </label>
      <label class="row">
        <span>Au coller<small>Ctrl+V dans un champ d'une page web</small></span>
        <span class="sw"><input type="checkbox" id="onPaste"><i></i></span>
      </label>
    </section>

    <section>
      <h2>Quoi</h2>
      <label class="row">
        <span>Numéros de téléphone<small>04.01.02.03.04 → 0401020304</small></span>
        <span class="sw"><input type="checkbox" id="phones"><i></i></span>
      </label>
      <label class="row">
        <span>Convertir +33 / 0033 en 0<small>+33 4 01 02 03 04 → 0401020304</small></span>
        <span class="sw"><input type="checkbox" id="convertFR"><i></i></span>
      </label>
      <label class="row">
        <span>Numéros de compte de facturation<small>2661502 004 → 2661502004</small></span>
        <span class="sw"><input type="checkbox" id="accounts"><i></i></span>
      </label>
      <label class="row">
        <span>Téléphones au milieu d'un texte<small>« Tél : 04 01 02 03 04 » → « Tél : 0401020304 »</small></span>
        <span class="sw"><input type="checkbox" id="inText"><i></i></span>
      </label>
    </section>

    <section>
      <h2>Divers</h2>
      <label class="row">
        <span>Afficher une confirmation<small>Petit message en bas à droite</small></span>
        <span class="sw"><input type="checkbox" id="toast"><i></i></span>
      </label>
      <label class="row" id="siteRow">
        <span>Actif sur <b id="host">ce site</b><small id="siteNote">Décoche pour exclure ce site</small></span>
        <span class="sw"><input type="checkbox" id="site"><i></i></span>
      </label>
    </section>
  </div>

  <section>
    <h2>Tester ou nettoyer à la main</h2>
    <textarea id="test" placeholder="Colle un numéro ici (par ex. copié depuis un PDF)…" spellcheck="false"></textarea>
    <div id="result" class="result"></div>
    <button id="copyResult" class="copy" type="button" hidden>Copier le résultat</button>
  </section>

  <script src="cleaner.js"></script>
  <script src="popup.js"></script>
</body>
</html>
